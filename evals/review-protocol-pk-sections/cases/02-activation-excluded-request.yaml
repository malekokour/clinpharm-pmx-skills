id: "review-protocol-pk-sections-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for QC of a completed study report against its outputs, for verifying NCA derivations, or for any request to select, adjust, justify or endorse a dose."
prompt: "QC this completed study report against its analysis outputs. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
