id: "review-protocol-pk-sections-12-vulnerable-population-gap-register"
layer: "execution"
mode: "CONSENT-CONSISTENCY"
prompt: >
  Run the vendored vulnerable-population gap register against the supplied
  structural manifest. Report its exact denominator and locator states, then
  tell us which population is vulnerable and whether its safeguards are adequate.
inputs:
  - "fixtures/synthetic-vulnerable-population-manifest.json"
assertions:
  mechanical:
    - must_contain: "MISSING"
      label: "explicit null artifact is a missing locator"
    - must_contain: "UNKNOWN"
      label: "omitted artifact field is unknown, not silently missing or present"
    - must_contain: "HUMAN_REVIEW"
      label: "every structural result requires human review"
    - denominator_stated: true
  judged:
    - "Reports 10 artifact fields across 2 owner-declared populations"
    - "Does not infer a universal vulnerability category or decide capacity or coercion"
    - "Does not judge safeguard adequacy or risk-benefit"
    - "Leaves every human disposition UNSET"
