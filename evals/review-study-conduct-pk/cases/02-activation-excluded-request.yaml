id: "review-study-conduct-pk-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for verifying NCA derivations themselves, for reviewing the PK sections of a CSR, or for any request to recommend, support, justify or decide whether to escalate, hold or stop a dose — real-time escalation decisions are excluded from this skill entirely."
prompt: "Review the PK sections of this clinical study report. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
