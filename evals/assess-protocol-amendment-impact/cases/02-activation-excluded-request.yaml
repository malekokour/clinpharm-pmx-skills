id: "assess-protocol-amendment-impact-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for unplanned deviations, sampling schedule adequacy, analysis plan amendments specifically, or to approve the amendment.\""
prompt: "Review this list of unplanned protocol deviations and tell me whether the study remains interpretable. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
