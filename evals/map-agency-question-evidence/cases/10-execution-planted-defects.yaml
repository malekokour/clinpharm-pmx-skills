id: "map-agency-question-evidence-10-execution-planted-defects"
layer: "execution"
mode: "FULL-MAP"
prompt: >
  Decompose this information request into answerable units, map each unit to the evidence
  we hold, and trace every claim in the draft response to its citation. Use the submission
  version baseline, and transcribe the request metadata as the request words it.
inputs:
  - "fixtures/synthetic-information-request.md"
  - "fixtures/synthetic-submission-baseline-and-history.md"
  - "fixtures/synthetic-evidence-sources.md"
  - "fixtures/synthetic-draft-response.md"
assertions:
  mechanical:
    - defect: "D2"
      severity: "Critical"
      detected_by: "script"
      observed: "1240 ng·h/mL"
      expected: "1420 ng·h/mL"
      locator_required: true
    - defect: "D8"
      severity: "Major"
      detected_by: "script"
      observed: "22.4 L/h"
      expected: "18.6 L/h"
      locator_required: true
    - defect: "D9"
      severity: "Major"
      detected_by: "script"
      observed: "612 µg/mL"
      expected: "612 ng/mL"
      locator_required: true
    - denominator_stated: true
  judged:
    - "Detects D1 (Critical): the document states Module 2.7.2 v3.0 where the source requires The version of Module 2.7.2 held by the authority is v2.0."
    - "Detects D3 (Critical): the document states Response due: 2026-10-18 where the source requires Response due: 2026-09-18"
    - "Detects D4 (Major): the document states The sponsor will conduct a dedicated hepatic impairment study and submit the report by Q3 2027. where the source requires Please confirm whether the applicant intends to conduct a dedicated hepatic impairment study."
    - "Detects D5 (Critical): the document states Responses to Questions 1–4 where the source requires Question 5"
    - "Detects D6 (Major): the document states Table 14.2.6 where the source requires The highest numbered pharmacokinetic table in the VTZ-201 CSR is Table 14.2.5."
    - "Detects D7 (Major): the document states Section 12.3 where the source requires §12.6 Renal function subgroup"
    - "Detects D10 (Minor): the document states VTZ-300 where the source requires VTZ-330"
    - "Detects D11 (Minor): the document states IR-2026-0471 where the source requires IR-2026-0417"
    - "Detects at least 9 of the 11 expert-keyed defects"
    - "Splits Question 4 into at least three answerable units, each carrying the request's wording verbatim"
    - "Reports the decomposition as a ratio of units to numbered questions, not as a bare unit count"
    - "Classifies Question 3 as commitment-sought and does not let the draft's commitment sentence stand as an answer"
    - "States no response deadline other than the one the request itself gives, and states no turnaround norm"
    - "Flags none of the five documented false-positive traps in the expert key, and gives every unit and gap a disposition written as open with owners marked proposed rather than assigned"
