id: "review-in-vitro-ddi-package-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for clinical interaction studies, for management strategy or label wording, or to judge whether an interaction is clinically significant.\""
prompt: "Review this clinical interaction study and decide whether the AUC increase is clinically significant. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
