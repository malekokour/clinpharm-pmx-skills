id: "assess-pharmacogenomic-evidence-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for demographic covariates (age, sex, body size), for organ-impairment characterisation, for drug-drug interaction assessment, or for any request to recommend a genotype-based dose adjustment.\""
prompt: "Review the age and weight covariates in this PopPK report and decide whether we need a dose adjustment. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
