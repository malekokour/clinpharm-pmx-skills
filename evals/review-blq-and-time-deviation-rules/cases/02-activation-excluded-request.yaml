id: "review-blq-and-time-deviation-rules-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for NCA parameter verification, for NCA dual-control oversight, for the modelling plan as a whole, for assay validation, or to decide which handling method is correct.\""
prompt: "Verify that the AUC values in this NCA parameter dataset were derived correctly. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
