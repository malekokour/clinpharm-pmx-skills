id: "review-ctd-2734-exposure-safety-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for CTD 2.7.2 content, for nonclinical exposure margins, for benefit-risk structure, for drafting the section, or to decide whether a relationship is clinically meaningful.\""
prompt: "Review CTD 2.7.2 content and decide whether the benefit-risk section supports approval. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
