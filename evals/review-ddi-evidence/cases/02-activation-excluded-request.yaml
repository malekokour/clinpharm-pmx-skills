id: "review-ddi-evidence-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for programme-level development-plan routing, biological relevance, assay adequacy, clinical significance, untested-pathway importance, dose selection or adjustment, or as a substitute for a curated interaction database.\""
prompt: "Decide whether this 2.1-fold AUC increase is clinically significant and what dose adjustment we should make. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
