id: "review-csr-pk-consistency-13-execution-pd-biomarker-local-trace"
layer: "execution"
mode: "PD-BIOMARKER-TRACE"
prompt: >
  Run the CSR-local PD/biomarker trace on this synthetic source set. Preserve
  source version/status and locators, apply the exact fixed-field denominator,
  keep incomplete evidence UNKNOWN, and do not make human-only judgments.
inputs:
  - "fixtures/synthetic-csr-pd-biomarker-trace.md"
assertions:
  judged:
    - "Checks exactly Identity, Role, Context of use, Specimen, Method, Timing, Decision rule, and Validation reference for the one declared measure"
    - "Reports the SYN-ECL v1 versus SYN-ECL v2 Method mismatch with both locators and source statuses"
    - "Reports Validation reference as UNKNOWN rather than clean, absent, or inferred"
    - "States 7 / (8 × 1) fields traced and 1 declared measure"
    - "Leaves findings at HUMAN_REVIEW and makes no plausibility, qualification, meaningfulness, surrogate, assay, endpoint, regulatory-acceptance, threshold-action, or dose judgment"
