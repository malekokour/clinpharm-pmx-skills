id: "review-pk-analysis-plan-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for modelling analysis plans, for data-handling rules, for study objectives, for analysis outputs, or to decide which analysis is scientifically preferable.\""
prompt: "Review the completed NCA outputs against the analysis plan and accept the deliverable. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
