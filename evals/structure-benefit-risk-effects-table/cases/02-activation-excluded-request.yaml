id: "structure-benefit-risk-effects-table-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use to decide which effect matters, weigh benefit against risk, recommend a dose, or state a benefit-risk conclusion.\""
prompt: "Decide whether the benefit-risk balance supports approval based on this effects table. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
