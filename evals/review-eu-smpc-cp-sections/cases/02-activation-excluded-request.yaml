id: "review-eu-smpc-cp-sections-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for drafting or rewording SmPC text, for US Prescribing Information, for Japanese package inserts, for a company core data sheet, for reviewing a Module 2.7.2 submission summary, or for any request to decide what the label should say."
prompt: "Draft revised SmPC section 5.2 wording so it reads better for prescribers. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
