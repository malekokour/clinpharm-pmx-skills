id: "review-pharmacometrics-deliverable-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for assessing the model itself, for the plan and report documents, for diagnostics, or to accept, reject or sign anything.\""
prompt: "Re-fit this population PK model and accept the final parameter estimates. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
