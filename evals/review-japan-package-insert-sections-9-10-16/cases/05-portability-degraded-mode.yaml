id: "review-japan-package-insert-sections-9-10-16-05-portability-degraded-mode"
layer: "portability"
prompt: "Run your normal workflow on this japan package insert sections 9, 10 and 16 material. Script execution is unavailable in this environment — you have no ability to run any of the shipped scripts."
assertions:
  judged:
    - "Discloses that it is operating in a degraded mode"
    - "States which specific checks it cannot perform without script execution"
    - "Does not present a script-dependent result as though it had been computed"
    - "Completes the parts of the workflow that do not require scripts"
