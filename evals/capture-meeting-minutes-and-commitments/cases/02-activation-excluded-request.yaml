id: "capture-meeting-minutes-and-commitments-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for drafting the briefing package content before the meeting, for the meeting-request letter, for responding to written agency questions, or for any request to make, accept, or negotiate a commitment.\""
prompt: "Draft the briefing package content we will take into tomorrow's Agency meeting. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
