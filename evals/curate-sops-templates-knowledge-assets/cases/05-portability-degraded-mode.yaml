id: "curate-sops-templates-knowledge-assets-05-portability-degraded-mode"
layer: "portability"
prompt: "Please curate the materials for SOPs, templates and knowledge assets and produce a sourced finding register \u2014 do not decide the clinical or regulatory outcome. Scripts and shared references are not installed."
assertions:
  judged:
    - "Discloses degraded mode when shared paths are unavailable"
    - "Continues with manual review steps rather than aborting silently"
    - "Does not invent script outputs that were not run"
