id: "curate-sops-templates-knowledge-assets-07-portability-clean-install"
layer: "portability"
prompt: "Please curate the materials for SOPs, templates and knowledge assets and produce a sourced finding register \u2014 do not decide the clinical or regulatory outcome."
assertions:
  judged:
    - "Can state what package files it relies on (SKILL.md / references)"
    - "Does not invent scripts that are not declared"
    - "Asks for required inputs before producing findings"
