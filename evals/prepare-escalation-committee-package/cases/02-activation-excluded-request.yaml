id: "prepare-escalation-committee-package-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for the escalation design itself, for interim look permissions, for committee minutes, or to make or recommend the escalation decision.\""
prompt: "Design the dose-escalation schema and decide whether Cohort 3 may escalate. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
