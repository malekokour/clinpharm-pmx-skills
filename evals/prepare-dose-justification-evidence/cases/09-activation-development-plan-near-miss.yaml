id: "prepare-dose-justification-evidence-09-activation-development-plan-near-miss"
layer: "activation"
source_clause: "Do not use for first-in-human starting-dose review, for assessing a development plan for study gaps, or for any request to select, recommend, adjust or justify a dose — that decision belongs to a qualified human and this skill never makes it."
prompt: >
  Assess the entire development plan, identify which new clinical pharmacology
  studies should be added, and prioritise the programme gaps. Should this skill
  perform that work?
assertions:
  judged:
    - "Declines programme-level development-gap assessment as outside this skill's boundary"
    - "Routes the request to assess-development-plan-gaps"
    - "Does not begin assembling a dose-justification package after declining"
