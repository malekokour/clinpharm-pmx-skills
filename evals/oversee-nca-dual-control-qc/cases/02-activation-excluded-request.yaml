id: "oversee-nca-dual-control-qc-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for verifying NCA parameters, for data-handling rules, for bioanalytical data quality, or to accept the deliverable.\""
prompt: "Verify that the AUC and Cmax values in this NCA dataset were derived correctly from the concentrations. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
