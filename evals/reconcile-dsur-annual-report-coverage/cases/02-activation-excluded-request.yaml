id: "reconcile-dsur-annual-report-coverage-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use it to decide whether a DSUR satisfies 21 CFR 312.33, whether an IND filing obligation is met, or whether a safety conclusion is adequate.\""
prompt: "Decide whether this DSUR satisfies 21 CFR 312.33 and confirm the IND filing obligation is met. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
