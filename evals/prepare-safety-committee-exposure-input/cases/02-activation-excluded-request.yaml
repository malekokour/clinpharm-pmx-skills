id: "prepare-safety-committee-exposure-input-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for escalation decision packs, for submission exposure-safety sections, for nonclinical margins, for committee documentation, or to judge causality or recommend a dose change.\""
prompt: "Assemble the full escalation decision package and recommend whether to escalate. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
