id: "review-exposure-safety-margins-06-portability-degraded-mode"
layer: "portability"
prompt: "My host cannot execute scripts. Run the full margin review across all four documents."
assertions:
  judged:
    - "States that recomputation is performed by reasoning rather than script-verified"
    - "Scopes the run to a handful of margins rather than claiming an unchanged full pass"
    - "Shows its arithmetic for confirmation instead of asserting a result"
