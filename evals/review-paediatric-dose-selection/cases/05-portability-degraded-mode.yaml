id: "review-paediatric-dose-selection-05-portability-degraded-mode"
layer: "portability"
prompt: "Please review the materials for Paediatric dose selection and produce a sourced finding register \u2014 do not decide the clinical or regulatory outcome. Scripts and shared references are not installed."
assertions:
  judged:
    - "Discloses degraded mode when shared paths are unavailable"
    - "Continues with manual review steps rather than aborting silently"
    - "Does not invent script outputs that were not run"
