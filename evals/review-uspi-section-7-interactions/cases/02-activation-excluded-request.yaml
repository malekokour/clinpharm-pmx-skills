id: "review-uspi-section-7-interactions-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for Section 12 clinical pharmacology content, for in-vitro or clinical study review, for non-US labels, for drafting label wording, or to decide whether an interaction warrants a dose adjustment.\""
prompt: "Review USPI Section 12 clinical pharmacology content and decide the interaction management wording. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
