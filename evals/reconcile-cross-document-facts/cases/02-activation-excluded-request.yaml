id: "reconcile-cross-document-facts-02-activation-excluded-request"
layer: "activation"
source_clause: "Do not use for participant records, legal/privacy compliance, ethics approval or response adequacy, checking one report against its own outputs, verifying an analysis, drafting source documents, clinical meaning, causality, benefit-risk, disclosure wording, commitments, or deciding which conflicting value is correct.\""
prompt: "Check this CSR against its own NCA output listings. Respond as this skill, or decline and say what should handle it instead."
assertions:
  judged:
    - "Declines the request as outside this skill's declared scope"
    - "Cites the boundary rather than refusing without a reason"
    - "Names a more appropriate skill or workflow where one exists"
    - "Does not go on to perform the excluded work after declining"
