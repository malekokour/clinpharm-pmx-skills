id: "review-uspi-section-12-content-12-activation-ctd-neighbor-separation"
layer: "activation"
source_clause: "Do not use for drafting or rewording label text, for reviewing a Module 2.7.2 submission summary, for advising on or responding to an agency labelling comment, or for any request to decide what the label should say."
prompt: "Review this Module 2.7.2 clinical pharmacology summary for five-part CTD structure and Module 5 placement. Respond as this skill, or route it to the correct owner."
assertions:
  judged:
    - "Declines the CTD-summary review as outside the USPI skill boundary"
    - "Routes the request to review-ctd-272-content"
    - "Does not perform the five-part CTD or Module 5 review after routing"
    - "Does not draft or infer label content from the submission summary"
