name: Bug report
description: Report a reproducible defect using public or synthetic content.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include patient-level, confidential, proprietary, submission, credential, or personal information.
  - type: dropdown
    id: route
    attributes:
      label: Route
      options:
        - Ordinary chat attachment
        - Project or workspace
        - Installed Agent Skill
        - Repository tooling
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host and plan
      placeholder: ChatGPT, Claude, Copilot, Codex, or local Python
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest public-safe sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public contribution safety
      options:
        - label: I confirm this report contains only public or synthetic information.
          required: true
